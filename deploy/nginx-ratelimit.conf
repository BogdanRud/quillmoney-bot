# Зона rate-limit для /api/login — должна объявляться на уровне http{}.
# Скопировать на сервер: cp deploy/nginx-ratelimit.conf /etc/nginx/conf.d/quillmoney-ratelimit.conf
# (conf.d уже подключён на уровне http{} в стандартном nginx.conf на Debian/Ubuntu)
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
