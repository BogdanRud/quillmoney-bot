# Nginx reverse-proxy для веб-панели QuillMoney.
# Скопировать на сервер: /etc/nginx/sites-available/quillmoney-admin
# и сделать симлинк: ln -s /etc/nginx/sites-available/quillmoney-admin /etc/nginx/sites-enabled/
#
# Перед использованием:
#   1. Замените your-domain.example на реальный домен (без HTTPS открывать
#      админку наружу нельзя — токен будет уходить в открытом виде).
#   2. Получите сертификат: certbot --nginx -d your-domain.example
#   3. Убедитесь, что uvicorn слушает YOUR_SERVER_IP:8000 (НЕ YOUR_SERVER_IP:8000) —
#      порт 8000 не должен быть напрямую доступен из интернета.
#   4. Скопируйте nginx-ratelimit.conf в /etc/nginx/conf.d/ — директива
#      limit_req_zone обязана быть на уровне http{}, внутри server{} она
#      вызывает ошибку "is not allowed here" и nginx не запустится.

# Редирект с HTTP на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.example;

    # Сертификаты подставит certbot автоматически (certbot --nginx)
    # ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Запрещаем индексацию и встраивание в iframe на уровне прокси тоже
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Базовая защита от брутфорса на уровне Nginx (доп. к лимиту в приложении).
    # Сама зона (limit_req_zone) объявлена в /etc/nginx/conf.d/quillmoney-ratelimit.conf —
    # тут только её использование, это разрешено внутри server{}/location{}.
    location /api/login {
        limit_req zone=admin_login burst=3 nodelay;
        proxy_pass http://YOUR_SERVER_IP:8000;
        include /etc/nginx/proxy_params_quillmoney;
    }

    location / {
        proxy_pass http://YOUR_SERVER_IP:8000;
        include /etc/nginx/proxy_params_quillmoney;
    }

    client_max_body_size 10m;  # ограничение размера загружаемых файлов (рассылка с фото)
}
